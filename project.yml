name: MDEditor
options:
  bundleIdPrefix: com.mdeditor
  xcodeVersion: "16.3"
  deploymentTarget:
    macOS: "15.0"
  defaultSourceDirectoryType: syncedFolder
  groupSortPosition: top

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.8.0

targets:
  MDEditor:
    type: application
    platform: macOS
    sources:
      - path: MDEditor
    dependencies:
      - package: swift-markdown
        product: Markdown
      - target: MDEditorThumbnail
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: MDEditor
        CFBundleDisplayName: MDEditor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.markdown
              - net.daringfireball.markdown
    entitlements:
      path: Support/MDEditor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeditor.app
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"

  MDEditorThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: MDEditorThumbnail
      - path: MDEditor/Markdown
        name: SharedMarkdown
    dependencies:
      - package: swift-markdown
        product: Markdown
    info:
      path: Support/MDEditorThumbnail-Info.plist
      properties:
        CFBundleName: MDEditorThumbnail
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
        QLSupportedContentTypes:
          - public.markdown
          - net.daringfireball.markdown
    entitlements:
      path: Support/MDEditorThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeditor.app.thumbnail
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  MDEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MDEditorTests
    dependencies:
      - target: MDEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeditor.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  MDEditor:
    build:
      targets:
        MDEditor: all
        MDEditorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDEditorTests
